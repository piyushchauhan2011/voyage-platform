name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (format, lint, static analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Spotless, Checkstyle, PMD, SpotBugs
        run: >
          ./mvnw -B -ntp
          spotless:check
          checkstyle:check
          pmd:check
          pmd:cpd-check
          -DskipTests
          compile
          spotbugs:check

  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run Surefire tests and JaCoCo gate
        run: ./mvnw -B -ntp test jacoco:report jacoco:check -DskipITs

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/
            **/target/jacoco.exec
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run Failsafe integration tests
        run: >
          ./mvnw -B -ntp verify
          -Dsurefire.skip=true
          -Djacoco.skip=true
          -Dspotbugs.skip=true
          -Dpmd.skip=true
          -Dcpd.skip=true
          -Dcheckstyle.skip=true
          -Dspotless.check.skip=true

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: "**/target/failsafe-reports/"
          if-no-files-found: ignore

  build:
    name: Package
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Package (skip tests)
        run: >
          ./mvnw -B -ntp package -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dcpd.skip=true
          -Dspotbugs.skip=true
          -Djacoco.skip=true
