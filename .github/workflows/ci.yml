name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (format, lint, static analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Spotless, Checkstyle, PMD, SpotBugs
        run: >
          ./mvnw -B -ntp
          spotless:check
          checkstyle:check
          pmd:check
          pmd:cpd-check
          -DskipTests
          compile
          spotbugs:check

  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run Surefire tests and JaCoCo gate
        run: ./mvnw -B -ntp test jacoco:report jacoco:check -DskipITs

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/
            **/target/jacoco.exec
          if-no-files-found: ignore

      - name: Coverage PR comment
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/**/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Unit test coverage
          update-comment: true
          min-coverage-overall: 40
          min-coverage-changed-files: 40

      - name: Annotate uncovered changed lines
        if: always() && github.event_name == 'pull_request'
        uses: Affanmir/diff-cover-action@v2
        with:
          coverage-files: voyage-app/target/site/jacoco/jacoco.xml
          src-roots: voyage-app/src/main/java
          compare-branch: origin/${{ github.base_ref }}
          create-annotations: true
          annotation-type: warning
          post-comment: false
          fail-on-threshold: false
          show-uncovered: true

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run Failsafe integration tests
        run: >
          ./mvnw -B -ntp verify
          -DskipUnitTests=true
          -Djacoco.skip=true
          -Dspotbugs.skip=true
          -Dpmd.skip=true
          -Dcpd.skip=true
          -Dcheckstyle.skip=true
          -Dspotless.check.skip=true

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: "**/target/failsafe-reports/"
          if-no-files-found: ignore

  build:
    name: Package
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Package (skip tests)
        run: >
          ./mvnw -B -ntp package -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dcpd.skip=true
          -Dspotbugs.skip=true
          -Djacoco.skip=true
