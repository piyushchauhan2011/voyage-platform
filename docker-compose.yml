services:

  # Postgres lab / app / SRE scrapes — start with: docker compose --profile postgres up -d
  # (or --profile app / --profile observability)
  postgres:
    profiles: ["postgres", "app", "observability"]
    # pgvector image (same PG16 base as postgres:16-alpine, so the existing volume still works)
    # ships the `vector` extension needed by the Phase 8 Spring AI lab
    image: pgvector/pgvector:pg16
    container_name: voyage-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis lab / app / SRE — start with: docker compose --profile redis up -d
  redis:
    profiles: ["redis", "app", "observability"]
    image: redis:7-alpine
    container_name: voyage-redis
    # Cap memory so the Redis eviction chaos lab can force allkeys-lru evictions
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka lab / app / SRE — start with: docker compose --profile kafka up -d
  zookeeper:
    profiles: ["kafka", "app", "observability"]
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: voyage-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    profiles: ["kafka", "app", "observability"]
    image: confluentinc/cp-kafka:7.6.0
    container_name: voyage-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dual listeners: in-compose clients use kafka:29092; host apps use localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # RabbitMQ lab / app — start with: docker compose --profile rabbitmq up -d
  rabbitmq:
    profiles: ["rabbitmq", "app"]
    image: rabbitmq:3.13-management
    container_name: voyage-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: voyage-lab-cookie
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Included in postgres + app profiles (not observability)
  pgadmin:
    profiles: ["postgres", "app"]
    image: dpage/pgadmin4:latest
    container_name: voyage-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  # SRE lab — start with: docker compose --profile observability up -d
  # (also starts postgres/redis/kafka backends via shared profiles)
  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.66.0
    container_name: voyage-redis-exporter
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"

  postgres-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: voyage-postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "9187:9187"

  kafka-exporter:
    profiles: ["observability"]
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: voyage-kafka-exporter
    depends_on:
      - kafka
    command:
      - --kafka.server=kafka:29092
    ports:
      - "9308:9308"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    container_name: voyage-prometheus
    depends_on:
      - redis-exporter
      - postgres-exporter
      - kafka-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.0
    container_name: voyage-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # Elasticsearch hotel search lab — start with: docker compose --profile elasticsearch up -d
  # (also included in --profile app)
  # Image major must match spring-boot-starter-data-elasticsearch's Java client (9.x on Boot 4.1)
  elasticsearch:
    profiles: ["elasticsearch", "app"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.5
    container_name: voyage-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.name: voyage-lab
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Opt-in local CI lab — start with: docker compose --profile jenkins up -d jenkins
  jenkins:
    profiles: ["jenkins"]
    build: ./jenkins
    image: voyage-jenkins:local
    container_name: voyage-jenkins
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
  rabbitmq-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
  jenkins-data:
