apiVersion: apps/v1
kind: Deployment
metadata:
  name: voyage-app
  namespace: voyage
spec:
  replicas: 1
  # Recreate kills the old pod before starting the new one, so the old pod's create-drop
  # shutdown sequence cannot race with the new pod's schema creation
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: voyage-app
  template:
    metadata:
      labels:
        app: voyage-app
    spec:
      # Wait for Postgres and Kafka to accept connections before starting the app
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo "waiting for postgres..."; sleep 3; done']
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo "waiting for kafka..."; sleep 3; done']
      containers:
        - name: voyage-app
          # imagePullPolicy: Never tells kind to use the locally-loaded image
          image: voyage-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: voyage-app-config
            - secretRef:
                name: voyage-app-secret
          # startupProbe gives the app up to 5 minutes to start (infra may be slow)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: voyage-app
  namespace: voyage
spec:
  type: NodePort
  selector:
    app: voyage-app
  ports:
    - port: 8080
      targetPort: 8080
      # Fixed node port so the URL is always localhost:30080
      nodePort: 30080
