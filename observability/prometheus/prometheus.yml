global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: voyage-app
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          application: voyage-app

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          application: voyage-redis

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          application: voyage-postgres

  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308
        labels:
          application: voyage-kafka
