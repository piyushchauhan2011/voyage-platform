spring:
  application:
    name: voyage-app

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false

  thymeleaf:
    cache: false

  # Datasource — reads from .env via docker-compose, falls back to defaults for local dev
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:voyage_db}
    username: ${POSTGRES_USER:voyage}
    password: ${POSTGRES_PASSWORD:voyage}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # create-drop: creates schema on startup, drops on shutdown — good for learning, never in prod
      # validate: only checks schema matches entities (prod-safe)
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_GROUP_ID:voyage-hotel-events-ui}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

application:
  booking:
    retry:
      attempts: 3
      backoff-ms: 50
  kafka:
    enabled: true
    retry:
      attempts: 3
      backoff-ms: 400
    topic:
      hotel-events: hotel-events
      hotel-events-dlt: hotel-events.DLT
  redis:
    enabled: true
    pubsub:
      channel: voyage:notifications
    cache:
      ttl:
        hotel-by-id: PT10M
        hotels-by-city: PT5M
  security:
    jwt:
      # dev-only key — replace with a securely generated secret in production
      secret-key: dLQCeGxj87SB0r8kCODJNiz40hxgfRyXJnQcQU9bqHg=
      expiration: 900000          # access token: 15 minutes (ms)
      refresh-token:
        expiration: 604800000     # refresh token: 7 days (ms)

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
