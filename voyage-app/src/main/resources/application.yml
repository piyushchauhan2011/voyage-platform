spring:
  application:
    name: voyage-app

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false

  thymeleaf:
    cache: false

  # Datasource — reads from .env via docker-compose, falls back to defaults for local dev
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:voyage_db}
    username: ${POSTGRES_USER:voyage}
    password: ${POSTGRES_PASSWORD:voyage}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # create-drop: creates schema on startup, drops on shutdown — good for learning, never in prod
      # validate: only checks schema matches entities (prod-safe)
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_GROUP_ID:voyage-hotel-events-ui}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # Phase 8 — Spring AI. Chat and embeddings are separate modules, so the key is set twice.
  # The "not-configured" fallback keeps the app bootable without a key (Spring AI asserts
  # a non-blank api-key at startup); the AI lab then reports the missing key per request
  # instead of taking the other phases down with it.
  ai:
    google:
      genai:
        # Gemini Developer API mode — an AI Studio key, no GCP project required
        api-key: ${GEMINI_API_KEY:not-configured}
        chat:
          model: gemini-2.5-flash
          temperature: 0.2
        embedding:
          api-key: ${GEMINI_API_KEY:not-configured}
          text:
            # text-embedding-004 has been retired and now 404s on embedContent
            model: gemini-embedding-001
            # This model defaults to 3072 dimensions, which pgvector's HNSW index cannot
            # handle (it caps at 2000). Asking for 768 keeps the index valid and must stay
            # in step with spring.ai.vectorstore.pgvector.dimensions below.
            dimensions: 768
            # RETRIEVAL_DOCUMENT tunes embeddings for the indexing side of search
            task-type: RETRIEVAL_DOCUMENT
    vectorstore:
      pgvector:
        # runs CREATE EXTENSION vector + creates the vector_store table on startup
        initialize-schema: true
        # must match the embedding dimensions requested above, or inserts fail
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

application:
  booking:
    retry:
      attempts: 3
      backoff-ms: 50
  kafka:
    enabled: true
    retry:
      attempts: 3
      backoff-ms: 400
    topic:
      hotel-events: hotel-events
      hotel-events-dlt: hotel-events.DLT
  rabbitmq:
    enabled: true
    exchange: voyage.jobs
    queues:
      booking-confirm: voyage.jobs.booking.confirm
      email-send: voyage.jobs.email.send
  redis:
    enabled: true
    pubsub:
      channel: voyage:notifications
    cache:
      ttl:
        hotel-by-id: PT10M
        hotels-by-city: PT5M
  ai:
    enabled: true
    # how many hotel documents the retriever pulls back for RAG
    top-k: 4
    similarity-threshold: 0.5
  security:
    jwt:
      # dev-only key — replace with a securely generated secret in production
      secret-key: dLQCeGxj87SB0r8kCODJNiz40hxgfRyXJnQcQU9bqHg=
      expiration: 900000          # access token: 15 minutes (ms)
      refresh-token:
        expiration: 604800000     # refresh token: 7 days (ms)

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
