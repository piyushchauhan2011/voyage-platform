# Test profile — swaps Postgres for in-memory H2 so tests run without Docker
spring:
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  thymeleaf:
    cache: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    listener:
      auto-startup: false
    consumer:
      auto-offset-reset: earliest
      group-id: voyage-test-consumers
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

application:
  booking:
    retry:
      attempts: 2
      backoff-ms: 1
  redis:
    enabled: false
  kafka:
    enabled: false
    retry:
      attempts: 2
      backoff-ms: 50
    topic:
      hotel-events: hotel-events-test
      hotel-events-dlt: hotel-events-test.DLT