# Test profile — swaps Postgres for in-memory H2 so tests run without Docker
spring:
  # The build must never need a GEMINI_API_KEY or a `vector`-capable database.
  # The embedding *connection* autoconfig is only @ConditionalOnClass, so
  # spring.ai.model.embedding.text=none is not enough — it has to be excluded outright.
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.elasticsearch.autoconfigure.health.ElasticsearchRestHealthContributorAutoConfiguration
      - org.springframework.boot.data.elasticsearch.autoconfigure.DataElasticsearchAutoConfiguration
      - org.springframework.boot.data.elasticsearch.autoconfigure.DataElasticsearchRepositoriesAutoConfiguration
      - org.springframework.boot.data.elasticsearch.autoconfigure.DataElasticsearchReactiveRepositoriesAutoConfiguration
      - org.springframework.boot.data.elasticsearch.autoconfigure.health.DataElasticsearchReactiveHealthContributorAutoConfiguration
  ai:
    model:
      chat: none
      embedding:
        text: none
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  datasource:
    # One database per application context. With a fixed name, every context shares a single H2
    # instance, so when the context cache evicts one, its ddl-auto=create-drop shutdown drops the
    # tables out from under the contexts still using it.
    url: jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  thymeleaf:
    cache: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    listener:
      auto-startup: false
    consumer:
      auto-offset-reset: earliest
      group-id: voyage-test-consumers
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

application:
  booking:
    retry:
      attempts: 2
      backoff-ms: 1
  ai:
    enabled: false
    top-k: 4
    similarity-threshold: 0.5
  search:
    enabled: false
    index: hotels-test
  redis:
    enabled: false
  rabbitmq:
    enabled: false
    exchange: voyage.jobs
    queues:
      booking-confirm: voyage.jobs.booking.confirm
      email-send: voyage.jobs.email.send
  kafka:
    enabled: false
    retry:
      attempts: 2
      backoff-ms: 50
    topic:
      hotel-events: hotel-events-test
      hotel-events-dlt: hotel-events-test.DLT
  observability:
    chaos:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    rabbit:
      enabled: false
    elasticsearch:
      enabled: false